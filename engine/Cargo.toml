[package]
name = "csvfab-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memmap2 = "0.9"
memchr = "2.8"
rayon = "1.12"
encoding_rs = "0.8"
regex = "1.13"
regex-syntax = "0.8"
aho-corasick = "1"
unicode-normalization = "0.1"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
foldhash = "0.2"
calamine = "0.37"
zip = { version = "9", default-features = false, features = ["deflate"] }
rust_xlsxwriter = { version = "0.101", features = ["constant_memory"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
blake2 = "0.11.0"
blake3 = "1.8.7"
getrandom = "0.4.3"
libc = "0.2"
fancy-regex = "0.20"
rustc-hash = "2"
