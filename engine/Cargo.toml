[package]
name = "csvfab-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memmap2 = "0.9"
memchr = "2.8"
rayon = "1.12"
encoding_rs = "0.8"
regex = "1.13"
regex-syntax = "0.8"
aho-corasick = "1"
unicode-normalization = "0.1"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
foldhash = "0.2"
calamine = "0.37"
zip = { version = "9", default-features = false, features = ["deflate"] }
# The workbook's sheet written by hand, in parallel (convert/xlsx_write.rs): all four already
# built for zip, rust_xlsxwriter and serde_json — no new crate.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
itoa = "1"
zmij = "1"
rust_xlsxwriter = { version = "0.101", features = ["constant_memory"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
blake2 = "0.11.0"
blake3 = "1.8.7"
getrandom = "0.4.3"
libc = "0.2"
fancy-regex = "0.20"
rustc-hash = "2"
# Parquet (convert/parquet_read.rs, parquet_write.rs): no default features, only the codecs
# files use. zstd is the one C library (built by cc, as SQLite). No brotli: 1.1 MB for a codec few
# files use, refused by name. crc: the checksums of pages that have one are checked.
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "lz4", "zstd", "simdutf8", "crc"] }
arrow-array = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
bytes = "1"
