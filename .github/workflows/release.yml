# On a v* tag: the source archives (for install.sh / install.ps1), the Windows
# installer (Inno Setup), a build check of the macOS bundle, SHA256SUMS, a GitHub release holding them all — then
# the package channels (AUR, Homebrew tap, winget: packages.yml).
# Run by hand (gh workflow run release.yml), it only builds and checks: no release, no packages.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "VERSION = \"$V\"" bridge/config.py \
            || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION in bridge/config.py"; exit 1; }
      - name: Build
        run: |
          V="${GITHUB_REF_NAME#v}"; mkdir dist
          git archive --format=tar.gz --prefix=csvfab/ -o "dist/csvfab-$V.tar.gz" HEAD
          git archive --format=zip    --prefix=csvfab/ -o "dist/csvfab-$V.zip" HEAD
          cp "dist/csvfab-$V.tar.gz" dist/csvfab.tar.gz      # stable names: releases/latest/download/…
          cp "dist/csvfab-$V.zip" dist/csvfab.zip
      - uses: actions/upload-artifact@v4
        with: { name: archives, path: dist/ }

  # Self-contained: Python's embeddable distribution (pinned, checksum checked) and
  # csvfab.exe, the native launcher winget requires (it refuses a script as entry point).
  windows:
    runs-on: windows-latest
    env:
      PY_EMBED: 3.14.9
      PY_EMBED_SHA256: 3C01D7CFC666F746A6F064F60FB2156AB0EC464D3D738AB796371A46A9BB24A2
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Bundled Python
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { "$env:GITHUB_REF_NAME".TrimStart('v') }
               else { (Select-String -Path bridge\config.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          New-Item -ItemType Directory build | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PY_EMBED/python-$env:PY_EMBED-embed-amd64.zip" -OutFile build\py.zip
          if ((Get-FileHash build\py.zip -Algorithm SHA256).Hash -ne $env:PY_EMBED_SHA256) { throw "python-$env:PY_EMBED-embed-amd64.zip: checksum mismatch" }
          Expand-Archive build\py.zip build\python
          Remove-Item build\py.zip
          "#define VER_COMMA $($v.Split('.') -join ','),0`n#define VER_STR `"$v`"" | Set-Content build\version.h -Encoding ascii
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          "VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" >> $env:GITHUB_ENV
      - name: Build csvfab.exe
        shell: cmd
        run: |
          call "%VCVARS%" || exit /b 1
          cd packaging\windows
          rc /nologo /I ..\..\build /fo ..\..\build\csvfab.res csvfab.rc || exit /b 1
          cl /nologo /O1 /MT /W3 csvfab.c ..\..\build\csvfab.res user32.lib /Fe..\..\build\csvfab.exe /Fo..\..\build\ /link /SUBSYSTEM:WINDOWS || exit /b 1
      - name: Check csvfab.exe and the bundled Python
        shell: pwsh
        run: |
          build\python\python.exe csvfab.py --version
          build\python\python.exe -S -c "import sys; sys.path.insert(0, '.'); import bridge.app, bridge.routes.files, sqlite3, ctypes, winreg"
          if ($LASTEXITCODE) { throw "the bundled Python cannot import the bridge" }
          # The launcher must hand its command line to pythonw untouched: a probe csvfab.py records it.
          New-Item -ItemType Directory probe | Out-Null
          Copy-Item build\csvfab.exe probe\; Copy-Item -Recurse build\python probe\python
          'import sys, json; open(sys.argv[0] + ".json", "w").write(json.dumps(sys.argv[1:]))' | Set-Content probe\csvfab.py
          Start-Process probe\csvfab.exe -ArgumentList '"a b.csv"', 'c.tsv'
          for ($i = 0; $i -lt 50 -and -not (Test-Path probe\csvfab.py.json); $i++) { Start-Sleep -Milliseconds 200 }
          $got = Get-Content probe\csvfab.py.json -Raw
          if ($got -ne '["a b.csv", "c.tsv"]') { throw "csvfab.exe passed: $got" }
      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging\windows\csvfab.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
      - name: Install it and run it
        shell: pwsh
        run: |
          Start-Process "dist\csvfab-setup-$env:APP_VERSION.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\csvfab"
          if (-not (Test-Path "$app\csvfab.exe")) { throw "csvfab.exe not installed" }
          $out = & "$app\python\python.exe" "$app\csvfab.py" --version
          if ($out -ne "csvfab $env:APP_VERSION") { throw "installed csvfab answers: $out" }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/ }

  # The macOS bundle is built on the user's Mac (install.sh, the cask); this only
  # proves that macos/build-app.sh still builds and that the result answers.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app bundle
        run: |
          sh macos/build-app.sh . dist
          plutil -lint dist/csvfab.app/Contents/Info.plist
          codesign --verify --deep --strict dist/csvfab.app
          python3 dist/csvfab.app/Contents/Resources/csvfab/csvfab.py --version
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes' dist/csvfab.app/Contents/Info.plist

  release:
    needs: [archives, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "csvfab ${GITHUB_REF_NAME#v}" --generate-notes

  packages:
    needs: release
    uses: ./.github/workflows/packages.yml
    with: { tag: '${{ github.ref_name }}' }
    secrets: inherit
