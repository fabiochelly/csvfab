# On a v* tag: the source archives (for install.sh / install.ps1), the Windows
# installer (Inno Setup), a build check of the macOS bundle, SHA256SUMS, a GitHub release holding them all — then
# the package channels (AUR, Homebrew tap, winget: packages.yml).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "VERSION = \"$V\"" bridge/config.py \
            || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION in bridge/config.py"; exit 1; }
      - name: Build
        run: |
          V="${GITHUB_REF_NAME#v}"; mkdir dist
          git archive --format=tar.gz --prefix=csvfab/ -o "dist/csvfab-$V.tar.gz" HEAD
          git archive --format=zip    --prefix=csvfab/ -o "dist/csvfab-$V.zip" HEAD
          cp "dist/csvfab-$V.tar.gz" dist/csvfab.tar.gz      # stable names: releases/latest/download/…
          cp "dist/csvfab-$V.zip" dist/csvfab.zip
      - uses: actions/upload-artifact@v4
        with: { name: archives, path: dist/ }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\csvfab.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/ }

  # The macOS bundle is built on the user's Mac (install.sh, the cask); this only
  # proves that macos/build-app.sh still builds and that the result answers.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app bundle
        run: |
          sh macos/build-app.sh . dist
          plutil -lint dist/csvfab.app/Contents/Info.plist
          codesign --verify --deep --strict dist/csvfab.app
          python3 dist/csvfab.app/Contents/Resources/csvfab/csvfab.py --version
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes' dist/csvfab.app/Contents/Info.plist

  release:
    needs: [archives, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "csvfab ${GITHUB_REF_NAME#v}" --generate-notes

  packages:
    needs: release
    uses: ./.github/workflows/packages.yml
    with: { tag: '${{ github.ref_name }}' }
    secrets: inherit
