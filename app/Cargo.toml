[package]
name = "csvfab"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "csvfab"
path = "src/lib.rs"

[[bin]]
name = "csvfab"
path = "src/main.rs"

[dependencies]
csvfab-engine = { path = "../engine" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "links"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
rfd = "0.17"
rayon = "1.12"
memmap2 = "0.9"
# The raw-text colours (syntax.rs): the web's grammars use look-around.
fancy-regex = "0.20"
# The font dialog's free fonts (fontshop.rs): GitHub's release list, the zip read by ranges.
regex = "1.13"
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Off-screen rendering of the real app for look checks (examples/shot.rs): no window.
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
