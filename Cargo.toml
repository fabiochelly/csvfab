[workspace]
resolver = "2"
members = ["engine", "app"]

[workspace.package]
version = "2.0.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# The symbol table is never loaded at run time: 2.5 MB off the file, no effect on speed.
# A crash's backtrace then shows addresses only: build without it to debug one.
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
